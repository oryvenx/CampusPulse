name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Only one deploy at a time; queue others
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3

jobs:
  # ----------------------------------------------------------------
  # Job 1: Backend tests
  # ----------------------------------------------------------------
  test:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Run pytest
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: pytest -v

  # ----------------------------------------------------------------
  # Job 2: Deploy backend via SSM Run Command
  # ----------------------------------------------------------------
  deploy-backend:
    name: Deploy backend (SSM Run Command)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Send SSM Run Command
        id: send
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "CI deploy ${{ github.sha }}" \
            --parameters 'commands=["sudo -u ec2-user bash /opt/campuspulse/repo/scripts/deploy_ec2.sh"]' \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $CMD_ID"

      - name: Wait for SSM result
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.send.outputs.command_id }}"
          INSTANCE="${{ secrets.EC2_INSTANCE_ID }}"

          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")

            echo "  [$i] status=$STATUS"
            case "$STATUS" in
              Success)  echo "✅ deploy succeeded"; break ;;
              Failed|Cancelled|TimedOut)
                echo "❌ deploy failed"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE" \
                  --query '{Std:StandardOutputContent,Err:StandardErrorContent}' \
                  --output text
                exit 1
                ;;
            esac
            sleep 10
          done

          if [ "$STATUS" != "Success" ]; then
            echo "❌ SSM command did not reach Success within 10 minutes"
            exit 1
          fi

  # ----------------------------------------------------------------
  # Job 3: Deploy frontend to S3 + invalidate CloudFront
  # ----------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontend (S3 + CloudFront)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build SPA
        working-directory: dashboard
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          set -euo pipefail
          BUCKET="${{ secrets.FRONTEND_BUCKET }}"
          aws s3 sync dashboard/dist "s3://${BUCKET}" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.map"

          # index.html must not be cached long
          aws s3 cp dashboard/dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "public,max-age=60,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/" "/index.html" "/assets/*" \
            --query 'Invalidation.Status' --output text