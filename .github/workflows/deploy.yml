name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-3

jobs:
  # ----------------------------------------------------------------
  # Job 1: Lint (fast — fails fast)
  # ----------------------------------------------------------------
  lint:
    name: Lint (ruff + terraform + prettier + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Ruff (Python lint)
        run: ruff check app/ tests/ simulator/

      - name: Ruff (Python format check)
        run: ruff format --check app/ tests/ simulator/

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.7"

      - name: Terraform fmt check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard deps
        working-directory: dashboard
        run: npm ci

      - name: Prettier format check
        working-directory: dashboard
        run: npm run format:check

      - name: ESLint
        working-directory: dashboard
        run: npm run lint

  # ----------------------------------------------------------------
  # Job 2: Backend tests
  # ----------------------------------------------------------------
  test:
    name: Backend tests (pytest)
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Run pytest
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
        run: pytest -v

  # ----------------------------------------------------------------
  # Job 3: Deploy backend via SSM Run Command
  # ----------------------------------------------------------------
  deploy-backend:
    name: Deploy backend (SSM Run Command)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Resolve EC2 instance ID from SSM
        id: instance
        run: |
          set -euo pipefail
          INSTANCE_ID=$(aws ssm get-parameter \
            --region "$AWS_REGION" \
            --name "/campuspulse/ec2_instance_id" \
            --query 'Parameter.Value' --output text)
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "Target instance: $INSTANCE_ID"

      - name: Send SSM Run Command
        id: send
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "CI deploy ${{ github.sha }}" \
            --parameters 'commands=["sudo -u ec2-user bash /opt/campuspulse/repo/scripts/deploy_ec2.sh"]' \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "Sent SSM command: $CMD_ID"

      - name: Wait for SSM result
        run: |
          set -euo pipefail
          CMD_ID="${{ steps.send.outputs.command_id }}"
          INSTANCE="${{ steps.instance.outputs.id }}"
          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$CMD_ID" \
              --instance-id "$INSTANCE" \
              --query 'Status' --output text 2>/dev/null || echo "Pending")
            echo "  [$i/60] status=$STATUS"
            case "$STATUS" in
              Success)
                echo "✅ deploy succeeded"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE" \
                  --query 'StandardOutputContent' --output text
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "❌ deploy failed with status=$STATUS"
                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$CMD_ID" \
                  --instance-id "$INSTANCE" \
                  --query '{Std:StandardOutputContent,Err:StandardErrorContent}' \
                  --output text
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "❌ SSM command did not reach Success within 10 minutes (last status: $STATUS)"
          exit 1

  # ----------------------------------------------------------------
  # Job 4: Deploy frontend to S3 + invalidate CloudFront
  # ----------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontend (S3 + CloudFront)
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install frontend dependencies
        working-directory: dashboard
        run: npm ci

      - name: Build SPA
        working-directory: dashboard
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          set -euo pipefail
          BUCKET="${{ secrets.FRONTEND_BUCKET }}"
          aws s3 sync dashboard/dist "s3://${BUCKET}" --delete \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "index.html" \
            --exclude "*.map"

          aws s3 cp dashboard/dist/index.html "s3://${BUCKET}/index.html" \
            --cache-control "public,max-age=60,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          set -euo pipefail
          DIST_ID="${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          aws cloudfront create-invalidation \
            --distribution-id "$DIST_ID" \
            --paths "/" "/index.html" "/assets/*" \
            --query 'Invalidation.Status' --output text
